# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - TriageCat-api

on:
  push:
    branches:
      - 'publish/current'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './triagecat-fun' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Publish Azure Functions'
        shell: bash
        run: |
          dotnet publish './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}' \
            --configuration Release \
            --output '${{ github.workspace }}/output'
      
      - name: Verify publish output
        run: |
          ls -la '${{ github.workspace }}/output'
          test -f '${{ github.workspace }}/output/host.json'
          test -f '${{ github.workspace }}/output/worker.config.json'
          test -f '${{ github.workspace }}/output/functions.metadata'

      - name: Inspect runtime configuration
        run: |
          cat '${{ github.workspace }}/output/triagecat-fun.runtimeconfig.json'
          cat '${{ github.workspace }}/output/worker.config.json'
          cat '${{ github.workspace }}/output/functions.metadata'

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9794A3DB7E784E78B0AED0C05194885D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C7B5330F28F74BA3B792EADD9A498D62 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D3E80ACC6C08428D8E59E4D1058BCFD4 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'TriageCat-api'
          slot-name: 'Production'
          package: '${{ github.workspace }}/output'
          sku: flexconsumption
          
